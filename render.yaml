# Render blueprint. Only the identity API lives here — everything browser-facing
# is on Vercel, which does not sleep.
#
# The build runs from the repository root, not from apps/sso-api: pnpm needs to
# see the workspace to link @traiectus/* packages.

services:
  - type: web
    name: traiectus-sso-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Migrations run at the end of the build, and only if it succeeded — the `&&`
    # keeps a compile error from ever reaching the database. The free tier has no
    # pre-deploy step, which is where this would otherwise belong, and startCommand
    # would re-run them on every wake from sleep.
    #
    # What that placement costs: the schema changes while the previous release is
    # still serving, and before anything knows the new one starts. That is removed by
    # a rule rather than accepted — every migration must be compatible with the
    # release already running. Additive changes ship alone; a removal is two deploys,
    # stop using it, then drop it.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @traiectus/sso-api build && pnpm --filter @traiectus/sso-api db:migrate
    startCommand: node apps/sso-api/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: traiectus-db
          property: connectionString
      - key: INTERNAL_API_KEY
        sync: false
      - key: ACCESS_TOKEN_PRIVATE_KEY
        sync: false

databases:
  - name: traiectus-db
    plan: free
    region: frankfurt
