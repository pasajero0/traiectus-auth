# Render blueprint. Only the identity API lives here — everything browser-facing
# is on Vercel, which does not sleep.
#
# The build runs from the repository root, not from apps/sso-api: pnpm needs to
# see the workspace to link @traiectus/* packages.

services:
  - type: web
    name: traiectus-sso-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /health
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @traiectus/sso-api build
    startCommand: node apps/sso-api/dist/index.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: traiectus-db
          property: connectionString
      - key: INTERNAL_API_KEY
        sync: false
      - key: ACCESS_TOKEN_PRIVATE_KEY
        sync: false

databases:
  - name: traiectus-db
    plan: free
    region: frankfurt
