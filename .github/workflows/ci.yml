name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Architecture and security guard. Runs first: a boundary violation makes
      # the rest of the run uninteresting.
      - run: pnpm guards

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # `pnpm verify` deliberately does not run *.db.test.ts — a green verify is not a green
  # suite by design. This is the other half, against a real Postgres.
  test-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: traiectus
          POSTGRES_PASSWORD: traiectus
          POSTGRES_DB: traiectus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://traiectus:traiectus@localhost:5432/traiectus_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vitest.db.config.ts migrates the database itself on startup — no separate migrate
      # step, the same way a developer's own `pnpm test:db` doesn't need one.
      - run: pnpm --filter @traiectus/sso-api test:db
